services:
  postgres:
    image: postgres:18
    container_name: gerenciador-quadras-postgres
    restart: always

    environment:
      POSTGRES_DB: gerenciador_quadras
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: gerenciador-quadras-mailpit
    restart: always

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
